version: "1"
name: C-0019-stream-updates-ricos

workspace:
  root: "."
  parent_branch: "main"
  worktrees_dir: ".worktrees"

# Registry — os 3 agentes passaram no probe (cache em .loopy/capabilities.json).
# model/effort aqui são o DEFAULT do agente; cada step pode sobrepor.
agents:
  claude:
    preset: claude
    model: opus[1m]
    effort: xhigh
    display_name: claude
  codex:
    preset: codex
    model: gpt-5.6-terra
    effort: xhigh
    display_name: codex
  opencode:
    # Registrado mas não referenciado por nenhum step: não spawna processo.
    # Fica aqui para trocar o `agent:` de um step sem re-sondar.
    preset: opencode

acp:
  default_agent: claude
  request_timeout_seconds: 1800
  permissions:
    default_mode: acceptEdits
    on_request: allow

inputs:
  spec: .harn/devy/changes/C-0019-stream-updates-ricos/spec.md
  plan: .harn/devy/changes/C-0019-stream-updates-ricos/plan.md
  todo: .harn/devy/changes/C-0019-stream-updates-ricos/todo.md
  backlog:
    pending_marker: "- [ ]"
    done_marker: "- [x]"
    task_id_pattern: T-\d+
    deps_pattern: "Deps:"
    body: indented
    mark_done_on_success: true

checks:
  ci:
    - name: typecheck
      run: npm run typecheck
    - name: lint
      run: npm run lint
    - name: test-engine
      run: npm test
    - name: test-app
      run: npm test -w apps/menubar
    - name: build
      run: npm run build
    # Condicional: só compila Rust quando o diff da Task toca src-tauri/ (T-004).
    - name: rust
      run: npm run check:rust

pipeline:
  - id: create-worktree
    type: shell
    run:
      - git worktree add -b "${task.branch}" "${worktree.path}" "${workspace.parent_branch}"

  - id: install-deps
    type: shell
    parallel_safe: true
    run:
      - npm ci --prefix "${worktree.path}"

  - id: implement
    type: agent
    agent: claude
    mode: acceptEdits
    clear_context: true
    prompt: |
      /devy:build Implemente a task ${task.id} — ${task.title} — conforme ${inputs.spec} e ${inputs.plan}.

      ${task.body}

      ## Carry da execução anterior — vazio na primeira passada

      Preenchido só quando o Run é retomado de um checkpoint parado neste step; nesse caso
      descreve o que falhou por último. Ignore se estiver vazio.

      ${checks.report}

      **CRITICAL**: NÃO rode git add/commit. Deixe todas as mudanças no working tree; o pipeline faz o commit.

      **FORMATAÇÃO**: este repo está fora de sincronia com o prettier e com o cargo fmt.
      Rode `prettier --write` APENAS em arquivo NOVO criado por você, e `cargo fmt` APENAS no
      arquivo Rust que você tocou (`rustfmt --check src/<arquivo>.rs`). NUNCA formate o repo
      inteiro: reformatar arquivo existente altera código alheio e gera conflito de merge.
      `docs/adrs/README.md` é gerado por `reindex.mjs` — nunca passe prettier nele.
    retry_prompt: |
      A tentativa anterior está no worktree, mas os checks falharam. Leia o código e corrija.

      ${checks.report}
    verify:
      run: ci
      max_attempts: 3

  - id: simplify
    type: agent
    agent: codex
    model: gpt-5.4-mini
    effort: low
    mode: agent
    clear_context: true
    prompt: |
      Invoke the code-simplification skill.

      Simplify recently changed code (or the specified scope) while preserving exact behavior:

      1. Read CLAUDE.md and study project conventions
      2. Identify the target code — recent changes unless a broader scope is specified
      3. Understand the code's purpose, callers, edge cases, and test coverage before touching it
      4. Scan for simplification opportunities:
        - Deep nesting → guard clauses or extracted helpers
        - Long functions → split by responsibility
        - Nested ternaries → if/else or switch
        - Generic names → descriptive names
        - Duplicated logic → shared functions
        - Dead code → remove after confirming
      5. Apply each simplification incrementally — run tests after each change
      6. Verify all tests pass, the build succeeds, and the diff is clean

      If tests fail after a simplification, revert that change and reconsider.

      **CRITICAL**: NÃO rode git add, git commit nem git stash. Deixe as mudanças no working
      tree; o pipeline faz o commit. Não formate o repo inteiro (prettier/cargo fmt globais
      reformatam código alheio).

      Diff atual:
      ${worktree.diff}
    verify:
      run: ci
      max_attempts: 3

  - id: review
    type: agent
    agent: codex
    model: gpt-5.6-terra
    effort: xhigh
    # `read-only` é PERMISSÃO do codex, não Modo plan — o Verdict sai no texto do
    # turno normalmente (o G1 só morde `mode: plan` do claude).
    mode: read-only
    clear_context: true
    prompt: |
      Invoke the code-review-and-quality skill.

      Você está revisando **uma task** de um backlog maior, não o repositório inteiro.
      O escopo desta revisão é exclusivamente o que ESTA task pede.

      ## Task sob revisão: ${task.id} — ${task.title}

      ${task.body}

      Especificação completa (contexto de fundo — leia se precisar; a **Acceptance** acima
      é que manda): ${inputs.spec}

      ## Regras de escopo — leia ANTES de julgar

      - A **Acceptance** acima é o contrato desta task. Satisfeita = PASS.
      - Arquivo fora da lista **Files:** desta task não é escopo desta revisão. Se o defeito
        real mora lá, registre como `Suggestion` — nunca como motivo de FAIL.
      - O que o corpo da task manda **manter como está**, mantenha. Reprovar código que a
        task explicitamente congela é erro de revisão, não achado.
      - As tasks irmãs do backlog cobrem o que falta. Integração prevista para outra task
        ausente aqui não é defeito.
      - Prefira evidência a hipótese: rode o **Verification** da task se ele for executável
        em read-only. Cenário hipotético que os testes existentes desmentem não é Critical.
        Duas armadilhas de invocação, que **não** são findings: o filtro do vitest é
        substring literal, não regex — um Verification `-- "A|B|C"` não casa nada (rode os
        nomes como args separados); e o sandbox read-only pode barrar o vitest do app, que
        precisa escrever `apps/menubar/node_modules/.vite-temp/`. Nos dois casos o comando
        falhou, não o código: relate que não conseguiu executar e julgue estaticamente.

      ## Eixos

      Review the current changes across all five axes:

      1. **Correctness** — Does it match the task's Acceptance? Edge cases handled? Tests adequate?
      2. **Readability** — Clear names? Straightforward logic? Well-organized?
      3. **Architecture** — Follows existing patterns? Clean boundaries? Right abstraction level?
      4. **Security** — Input validated? Secrets safe? Auth checked? (Use security-and-hardening skill)
      5. **Performance** — No N+1 queries? No unbounded ops? (Use performance-optimization skill)

      Categorize findings as Critical, Important, or Suggestion.
      Output a structured review with specific file:line references and fix recommendations.

      ## Veredito — só Critical reprova

      **Critical** = quebra um item da Acceptance desta task, quebra comportamento existente
      (regressão), ou introduz vulnerabilidade explorável no código desta task. Nada mais.

      `Important` e `Suggestion` entram no relatório e **não** bloqueiam: há um Gate de
      Aprovação humano no merge, e reprovar por eles re-roda a implementação inteira.
      Na dúvida entre Critical e Important, é **Important**.

      **CRITICAL:** NUNCA EDITE NADA — esta revisão é read-only. Não crie, não altere e não
      formate arquivo algum.

      Diff sob revisão:
      ${worktree.diff}

      Responda na ÚLTIMA linha exatamente "REVIEW: PASS" ou
      "REVIEW: FAIL: <o item da Acceptance ou o comportamento que quebrou>".
    expect: "REVIEW: PASS"
    # Obrigatório: sem ele o caminho aprovado cairia sequencialmente no `review-fix`.
    on_success:
      goto: commit
    # Volta para um fix CIRÚRGICO, não para o `implement`: re-implementar do zero e
    # re-simplificar custa 3 turnos caros por volta e faz o review mudar de alvo.
    on_fail:
      goto: review-fix

  - id: review-fix
    type: agent
    agent: claude
    mode: acceptEdits
    clear_context: true
    prompt: |
      A revisão reprovou a task ${task.id} — ${task.title} por um finding **Critical**:
      algo que quebra um item da Acceptance da task, quebra comportamento existente
      (regressão), ou é uma vulnerabilidade explorável neste código.

      A implementação já está no worktree e passou nos checks. Corrija **apenas** o que o
      relatório abaixo aponta como Critical — cirurgicamente. Não refatore o que está
      funcionando, não expanda o escopo e não toque em arquivo fora da lista `Files:`.

      ## Task

      ${task.body}

      ## Relatório da revisão

      ${checks.report}

      ## Se o finding for improcedente

      O revisor não executa a suíte (roda read-only) e às vezes levanta um cenário
      hipotético que o código já trata. Se for o caso, **não** mude o comportamento:
      acrescente um teste de regressão que prove o cenário apontado, para que a próxima
      revisão tenha evidência em vez de suposição.

      **CRITICAL**: NÃO rode git add/commit. Deixe as mudanças no working tree; o pipeline
      faz o commit.

      **FORMATAÇÃO**: `prettier --write` apenas em arquivo NOVO criado por você; `cargo fmt`
      apenas no arquivo Rust que você tocou. Nunca formate o repo inteiro.
    retry_prompt: |
      A correção está no worktree, mas os checks falharam. Leia o código e corrija.

      ${checks.report}
    verify:
      run: ci
      max_attempts: 3
    # Volta ao review para revalidar; `on_fail` fica no default (escalate) — checks que
    # não fecham em 3 tentativas são problema humano, não mais uma volta no ciclo.
    on_success:
      goto: review

  - id: commit
    type: shell
    run:
      - git -C "${worktree.path}" add -A -- .
      - 'git -C "${worktree.path}" commit --allow-empty -m "feat(${task.id}): ${task.title}"'

  # --- Merge pessimista: integra o parent DENTRO do worktree antes do root -----
  - id: reconcile-parent
    type: shell
    parallel_safe: true
    run:
      - git -C "${worktree.path}" merge --no-edit "${workspace.parent_branch}"
    on_success:
      goto: merge
    on_fail:
      goto: resolve-merge

  - id: resolve-merge
    type: agent
    agent: claude
    mode: acceptEdits
    clear_context: true
    prompt: |
      Ao integrar ${workspace.parent_branch} no worktree desta task houve CONFLITO de merge
      (merge em progresso, arquivos com markers `<<<<<<<`/`=======`/`>>>>>>>`).

      Resolva SEMANTICAMENTE cada conflito: preserve a intenção dos DOIS lados — a mudança da
      task ${task.id} (${task.title}) E o que veio do parent — em vez de escolher um lado
      cegamente. Não altere comportamento fora das regiões conflitadas.

      Inspecione o estado com:
        git -C "${worktree.path}" status
        git -C "${worktree.path}" diff
      e edite os arquivos removendo TODOS os markers de conflito.

      **CRITICAL**: NÃO rode git add/commit/merge --continue/--abort. Apenas deixe os arquivos
      resolvidos no working tree; o pipeline finaliza o merge. Garanta os checks verdes.
    retry_prompt: |
      Ainda há conflito não resolvido ou os checks falharam após a resolução. Verifique
      `git -C "${worktree.path}" status` (não pode haver caminhos "Unmerged") e corrija.

      ${checks.report}
    verify:
      run: ci
      max_attempts: 3
    on_fail: escalate

  - id: finalize-merge
    type: shell
    run:
      - git -C "${worktree.path}" add -A -- .
      - git -C "${worktree.path}" commit --no-edit

  - id: merge
    type: approval
    prompt: Aprovar merge da task ${task.id} (${task.title}) em ${workspace.parent_branch}?
    run:
      - 'git -C "${workspace.root}" merge --no-ff "${task.branch}" -m "merge(${task.id}): ${task.title}"'
    # NUNCA escalate aqui: escalaria com o root SUJO e derrubaria as tasks irmãs.
    on_fail:
      goto: abort-root-merge
    # Obrigatório: sem ele o caminho felizmente-merjado cairia no abort abaixo.
    on_success:
      goto: cleanup

  - id: abort-root-merge
    type: shell
    run:
      - git -C "${workspace.root}" merge --abort
    on_success:
      goto: reconcile-parent

  - id: cleanup
    type: shell
    always: true
    run:
      - bash "${workspace.root}/scripts/cleanup-worktree.sh" "${workspace.root}" "${worktree.path}" "${task.branch}"

stop_conditions:
  max_iterations: 25
  # Teto real do ciclo review ↔ review-fix (era 25 — deixava ~12 voltas caras rodarem).
  # Não baixar mais: o mesmo contador governa o ciclo de merge
  # (merge → abort-root-merge → reconcile-parent), que sob concorrência precisa de folga.
  max_step_visits: 10
  stop_signal_file: .loopy.stop

concurrency: auto
max_concurrency: 3

policies:
  escalation:
    action: pause
    keep_worktree: true
    notify: stderr
  git:
    require_clean_parent: true
    on_merge_conflict: escalate

logging:
  dir: .loopy/logs
  per_task: true
  capture_acp_traffic: true

metrics: {}
